name: Deploy Anya Forger Kawaii Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create Site Structure
        run: |
          mkdir -p _site

          # ─────────────────────────────────────────
          # style.css
          # ─────────────────────────────────────────
          cat > _site/style.css << 'CSSEOF'
          @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&family=Zen+Maru+Gothic:wght@400;700&display=swap');

          *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

          :root {
            --rose:    #f72585;
            --pink:    #ff85b3;
            --blush:   #ffd6e7;
            --sky:     #a8dadc;
            --mint:    #caffbf;
            --cream:   #fffbe6;
            --plum:    #7209b7;
            --navy:    #023047;
            --white:   #ffffff;
            --shadow-pink: rgba(247,37,133,.25);
            --shadow-dark: rgba(2,48,71,.18);
            --r: 20px;
            --nav-h: 68px;
          }

          html { scroll-behavior: smooth; }

          body {
            font-family: 'M PLUS Rounded 1c', 'Zen Maru Gothic', sans-serif;
            background: var(--cream);
            color: var(--navy);
            overflow-x: hidden;
          }

          /* ── SCROLLBAR ── */
          ::-webkit-scrollbar { width: 8px; }
          ::-webkit-scrollbar-track { background: var(--blush); }
          ::-webkit-scrollbar-thumb { background: var(--rose); border-radius: 4px; }

          /* ── CURSOR ── */
          body { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><text y='26' font-size='26'>🥜</text></svg>") 16 16, auto; }

          /* ══════════════════════════════════════
             ANIMATIONS
          ══════════════════════════════════════ */
          @keyframes float-y {
            0%,100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-18px) rotate(6deg); }
          }
          @keyframes float-y2 {
            0%,100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-12px) rotate(-4deg); }
          }
          @keyframes heartbeat {
            0%,100% { transform: scale(1); }
            14%      { transform: scale(1.25); }
            28%      { transform: scale(1); }
            42%      { transform: scale(1.15); }
            70%      { transform: scale(1); }
          }
          @keyframes shimmer {
            0%   { background-position: -200% center; }
            100% { background-position:  200% center; }
          }
          @keyframes spin-slow {
            to { transform: rotate(360deg); }
          }
          @keyframes waku {
            0%,100% { transform: scale(1) rotate(0deg); }
            25%      { transform: scale(1.06) rotate(-2deg); }
            75%      { transform: scale(1.06) rotate( 2deg); }
          }
          @keyframes pop-in {
            0%   { opacity:0; transform: scale(.6) rotate(-8deg); }
            80%  { transform: scale(1.06) rotate(2deg); }
            100% { opacity:1; transform: scale(1) rotate(0deg); }
          }
          @keyframes slide-up {
            from { opacity:0; transform: translateY(40px); }
            to   { opacity:1; transform: translateY(0); }
          }
          @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); opacity:0; }
          }
          @keyframes marquee {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
          }
          @keyframes pulse-border {
            0%,100% { box-shadow: 0 0 0 0 var(--shadow-pink); }
            50%      { box-shadow: 0 0 0 10px transparent; }
          }
          @keyframes bg-shift {
            0%,100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
          }

          /* ══════════════════════════════════════
             FLOATING PARTICLES (global overlay)
          ══════════════════════════════════════ */
          #particles {
            position: fixed; inset: 0; pointer-events: none; z-index: 9000; overflow: hidden;
          }
          .p { position: absolute; font-size: 22px; opacity: .65; animation: float-y 6s ease-in-out infinite; }
          .p:nth-child(1)  { left:4%;   top:8%;  animation-delay:0s;   animation-duration:5s; }
          .p:nth-child(2)  { left:15%;  top:55%; animation-delay:1.2s; animation-duration:7s; }
          .p:nth-child(3)  { left:78%;  top:18%; animation-delay:2s;   animation-duration:6s; }
          .p:nth-child(4)  { left:88%;  top:65%; animation-delay:3s;   animation-duration:8s; }
          .p:nth-child(5)  { left:50%;  top:4%;  animation-delay:4s;   animation-duration:5.5s; }
          .p:nth-child(6)  { left:30%;  top:75%; animation-delay:.5s;  animation-duration:6.5s; }
          .p:nth-child(7)  { left:65%;  top:40%; animation-delay:1.8s; animation-duration:5s; }
          .p:nth-child(8)  { left:10%;  top:30%; animation-delay:2.5s; animation-duration:7s; }

          /* ══════════════════════════════════════
             TICKER
          ══════════════════════════════════════ */
          .ticker {
            background: var(--rose);
            color: #fff;
            font-weight: 900;
            font-size: .95rem;
            letter-spacing: .08em;
            overflow: hidden;
            white-space: nowrap;
            padding: 8px 0;
          }
          .ticker-inner { display: inline-flex; animation: marquee 28s linear infinite; gap: 0; }
          .ticker span { padding: 0 40px; }

          /* ══════════════════════════════════════
             NAV
          ══════════════════════════════════════ */
          nav {
            position: sticky; top: 0; z-index: 500;
            height: var(--nav-h);
            background: rgba(255,255,255,.75);
            backdrop-filter: blur(18px);
            border-bottom: 2px solid var(--blush);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 4px 20px var(--shadow-pink);
          }
          .nav-logo {
            font-weight: 900; font-size: 1.5rem;
            background: linear-gradient(90deg, var(--rose), var(--plum));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: waku 4s ease-in-out infinite;
            text-decoration: none;
          }
          nav ul { list-style: none; display: flex; gap: 10px; }
          nav a {
            text-decoration: none; color: var(--navy); font-weight: 700;
            font-size: 1rem; padding: 8px 20px; border-radius: 50px;
            border: 2px solid transparent;
            transition: all .25s ease; display: flex; align-items: center; gap: 6px;
          }
          nav a:hover, nav a.active {
            background: var(--blush); border-color: var(--rose); color: var(--rose);
            transform: translateY(-2px);
          }
          .nav-toggle { display: none; background: none; border: none; font-size: 1.8rem; cursor: pointer; }

          /* ══════════════════════════════════════
             HERO
          ══════════════════════════════════════ */
          .hero {
            min-height: calc(100vh - var(--nav-h));
            display: grid; grid-template-columns: 1fr 1fr;
            align-items: center; gap: 40px;
            padding: 60px 60px 60px 80px;
            position: relative; overflow: hidden;
          }
          .hero-bg {
            position: absolute; inset: 0; z-index: 0;
            background:
              radial-gradient(ellipse 70% 60% at 80% 50%, rgba(255,133,179,.18) 0%, transparent 70%),
              radial-gradient(ellipse 50% 80% at 10% 80%, rgba(168,218,220,.2) 0%, transparent 60%),
              var(--cream);
          }
          .hero-bg img {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: .07; mix-blend-mode: multiply;
          }
          .hero-left { position: relative; z-index: 1; }
          .hero-tag {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--blush); color: var(--rose);
            font-weight: 700; font-size: .85rem; padding: 6px 16px;
            border-radius: 50px; margin-bottom: 18px;
            border: 1.5px solid var(--pink);
            animation: pop-in .7s ease both;
          }
          .hero h1 {
            font-weight: 900; font-size: clamp(2rem, 5vw, 3.4rem);
            line-height: 1.18; margin-bottom: 18px;
            animation: slide-up .8s ease both .2s;
          }
          .hero h1 .shimmer {
            background: linear-gradient(90deg, var(--rose), var(--plum), var(--rose));
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
          }
          .hero-desc {
            font-size: 1.1rem; line-height: 1.75; color: #444;
            max-width: 480px; margin-bottom: 30px;
            animation: slide-up .8s ease both .35s;
          }
          .hero-btns {
            display: flex; flex-wrap: wrap; gap: 14px;
            animation: slide-up .8s ease both .5s;
          }
          .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 28px; border-radius: 50px;
            font-weight: 700; font-size: 1rem; text-decoration: none;
            transition: all .28s ease; border: 2px solid transparent;
          }
          .btn-primary {
            background: linear-gradient(135deg, var(--rose), var(--plum));
            color: #fff; box-shadow: 0 8px 25px var(--shadow-pink);
          }
          .btn-primary:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 14px 35px var(--shadow-pink); }
          .btn-outline {
            background: transparent; color: var(--rose);
            border-color: var(--rose);
          }
          .btn-outline:hover { background: var(--blush); transform: translateY(-3px); }

          .hero-right {
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: center;
          }
          .hero-img-wrap {
            position: relative; width: min(380px, 90vw); aspect-ratio: 1;
          }
          .hero-ring {
            position: absolute; inset: -18px;
            border-radius: 50%;
            background: conic-gradient(var(--rose), var(--pink), var(--sky), var(--mint), var(--rose));
            animation: spin-slow 10s linear infinite;
            opacity: .6;
          }
          .hero-ring::after {
            content: ''; position: absolute; inset: 8px;
            background: var(--cream); border-radius: 50%;
          }
          .hero-main-img {
            position: relative; z-index: 1;
            width: 100%; aspect-ratio: 1; border-radius: 50%;
            object-fit: cover; object-position: top;
            border: 6px solid #fff;
            box-shadow: 0 20px 60px var(--shadow-pink);
            animation: float-y 5s ease-in-out infinite;
            background: var(--blush);
          }
          .hero-badge {
            position: absolute; bottom: 10px; right: -10px; z-index: 2;
            background: #fff; border-radius: 20px; padding: 10px 16px;
            box-shadow: 0 8px 24px var(--shadow-dark);
            font-weight: 700; font-size: .9rem; color: var(--rose);
            border: 2px solid var(--blush);
            animation: heartbeat 2.5s ease-in-out infinite;
          }
          .hero-badge span { font-size: 1.2rem; }

          /* ══════════════════════════════════════
             SECTION COMMONS
          ══════════════════════════════════════ */
          section { padding: 70px 40px; }
          .section-head {
            text-align: center; margin-bottom: 50px;
          }
          .section-head .eyebrow {
            display: inline-block; font-size: .8rem; font-weight: 900;
            letter-spacing: .18em; text-transform: uppercase;
            color: var(--rose); margin-bottom: 10px;
          }
          .section-head h2 {
            font-weight: 900; font-size: clamp(1.7rem, 4vw, 2.8rem);
            position: relative; display: inline-block;
          }
          .section-head h2::after {
            content: ''; display: block; height: 5px;
            background: linear-gradient(90deg, var(--rose), var(--plum));
            border-radius: 4px; margin-top: 10px;
          }
          .container { max-width: 1200px; margin: 0 auto; }

          /* ══════════════════════════════════════
             INFO BANNER (between hero and gallery)
          ══════════════════════════════════════ */
          .info-banner {
            background: linear-gradient(135deg, var(--rose) 0%, var(--plum) 100%);
            color: #fff; padding: 50px 40px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px; text-align: center;
          }
          .info-stat { padding: 10px; }
          .info-stat .num {
            font-weight: 900; font-size: 2.6rem;
            display: block; animation: heartbeat 3s ease-in-out infinite;
          }
          .info-stat .lbl { font-size: .95rem; opacity: .85; }

          /* ══════════════════════════════════════
             GALLERY
          ══════════════════════════════════════ */
          .gallery-bg { background: linear-gradient(180deg, var(--cream) 0%, var(--blush) 100%); }
          .masonry {
            columns: 3; column-gap: 22px;
          }
          @media (max-width:900px)  { .masonry { columns: 2; } }
          @media (max-width:500px)  { .masonry { columns: 1; } }
          .m-item {
            break-inside: avoid; margin-bottom: 22px;
            border-radius: var(--r); overflow: hidden;
            position: relative; cursor: pointer;
            box-shadow: 0 8px 28px var(--shadow-dark);
            transition: transform .35s ease, box-shadow .35s ease;
          }
          .m-item:hover { transform: scale(1.03) rotate(-.8deg); box-shadow: 0 18px 45px var(--shadow-pink); }
          .m-item img {
            width: 100%; display: block;
            transition: transform .5s ease;
            background: var(--blush);
          }
          .m-item:hover img { transform: scale(1.08); }
          .m-caption {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 30px 16px 14px;
            background: linear-gradient(transparent, rgba(2,48,71,.65));
            color: #fff; font-weight: 700; font-size: .9rem;
            transform: translateY(100%); transition: transform .35s ease;
          }
          .m-item:hover .m-caption { transform: translateY(0); }

          /* ══════════════════════════════════════
             ABOUT / CHARACTERS GRID
          ══════════════════════════════════════ */
          .about-bg { background: var(--cream); }
          .char-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 28px;
          }
          .char-card {
            background: #fff; border-radius: calc(var(--r)*1.5);
            overflow: hidden;
            box-shadow: 0 6px 24px var(--shadow-dark);
            transition: transform .3s ease, box-shadow .3s ease;
            animation: pulse-border 3s ease-in-out infinite;
            animation-play-state: paused;
          }
          .char-card:hover {
            transform: translateY(-10px) rotate(1deg);
            box-shadow: 0 20px 50px var(--shadow-pink);
            animation-play-state: running;
          }
          .char-img { width:100%; aspect-ratio:3/4; object-fit:cover; object-position:top; background:var(--blush); }
          .char-info { padding: 18px 20px; }
          .char-name {
            font-weight: 900; font-size: 1.2rem; color: var(--rose);
            margin-bottom: 6px;
          }
          .char-role {
            font-size: .82rem; font-weight: 700; color: var(--plum);
            letter-spacing: .06em; text-transform: uppercase;
            margin-bottom: 10px;
          }
          .char-desc { font-size: .9rem; line-height: 1.6; color: #555; }
          .char-tag {
            display: inline-block; margin-top: 10px;
            background: var(--blush); color: var(--rose);
            padding: 4px 12px; border-radius: 50px;
            font-size: .78rem; font-weight: 700;
          }

          /* ══════════════════════════════════════
             BUBBLE QUOTE
          ══════════════════════════════════════ */
          .bubble-section { background: var(--blush); text-align: center; padding: 50px 30px; }
          .bubble {
            display: inline-block; background: #fff;
            border-radius: 30px; padding: 24px 36px;
            position: relative; max-width: 640px;
            box-shadow: 0 8px 30px var(--shadow-pink);
            font-size: 1.2rem; font-weight: 700; color: var(--navy);
            border: 3px solid var(--pink);
            animation: waku 4s ease-in-out infinite;
          }
          .bubble::after {
            content:''; position:absolute; bottom:-22px; left:50%;
            transform:translateX(-50%);
            border:11px solid transparent; border-top-color: var(--pink);
          }
          .bubble-img {
            width: 90px; height: 90px; border-radius:50%; object-fit:cover;
            border: 4px solid var(--rose); margin-top: 30px;
            display: block; margin-left: auto; margin-right: auto;
            box-shadow: 0 6px 20px var(--shadow-pink);
            animation: float-y 4s ease-in-out infinite;
            background: var(--blush);
          }

          /* ══════════════════════════════════════
             PAGE HEADER (manga / video pages)
          ══════════════════════════════════════ */
          .page-hero {
            min-height: 300px; display:flex; flex-direction:column;
            align-items:center; justify-content:center; text-align:center;
            position:relative; overflow:hidden; padding: 60px 30px 50px;
          }
          .page-hero-bg {
            position:absolute; inset:0; z-index:0;
            background-size: 200% 200%;
            animation: bg-shift 8s ease infinite;
          }
          .page-hero-bg.manga-bg {
            background: linear-gradient(135deg, #fff0f5, #e0f0ff, #fce4ff);
          }
          .page-hero-bg.video-bg {
            background: linear-gradient(135deg, #0d1b2a, #1b4570, #0d1b2a);
          }
          .page-hero-bg img {
            position:absolute; inset:0; width:100%; height:100%;
            object-fit:cover; opacity:.12; mix-blend-mode:luminosity;
          }
          .page-hero > * { position:relative; z-index:1; }
          .page-hero h1 {
            font-weight:900; font-size:clamp(1.8rem,5vw,3rem); margin-bottom:12px;
          }
          .page-hero .sub { font-size:1.1rem; opacity:.8; max-width:560px; }
          .page-hero.manga-page h1 { color: var(--plum); text-shadow: 2px 2px 0 #fff; }
          .page-hero.video-page h1 { color: #fff; }
          .page-hero.video-page .sub { color: rgba(255,255,255,.75); }

          /* ══════════════════════════════════════
             CARDS GRID (manga volumes / episodes)
          ══════════════════════════════════════ */
          .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 28px;
          }
          .vol-card {
            background: #fff; border-radius: var(--r);
            overflow: hidden;
            box-shadow: 0 6px 22px var(--shadow-dark);
            transition: transform .3s ease, box-shadow .3s ease;
            display: flex; flex-direction: column;
          }
          .vol-card:hover {
            transform: translateY(-10px) rotate(-1deg);
            box-shadow: 0 20px 50px var(--shadow-pink);
          }
          .vol-card img {
            width:100%; aspect-ratio:2/3; object-fit:cover;
            background: var(--blush);
            transition: transform .4s ease;
          }
          .vol-card:hover img { transform: scale(1.06); }
          .vol-body { padding:18px; flex:1; display:flex; flex-direction:column; }
          .vol-num {
            font-size:.75rem; font-weight:900; letter-spacing:.1em;
            text-transform:uppercase; color:var(--rose); margin-bottom:6px;
          }
          .vol-title { font-weight:900; font-size:1.1rem; margin-bottom:8px; }
          .vol-desc { font-size:.88rem; line-height:1.6; color:#555; flex:1; margin-bottom:14px; }
          .vol-card .btn {
            padding:10px 20px; font-size:.9rem; align-self:flex-start;
          }

          /* episode card (video page) */
          .ep-card {
            background: #0d1b2a; border-radius: var(--r);
            overflow:hidden;
            box-shadow: 0 6px 22px rgba(0,0,0,.35);
            transition: transform .3s ease, box-shadow .3s ease;
            color: #fff; display:flex; flex-direction:column;
          }
          .ep-card:hover {
            transform: translateY(-10px) rotate(1deg);
            box-shadow: 0 20px 50px rgba(247,37,133,.35);
          }
          .ep-thumb {
            width:100%; aspect-ratio:16/9; object-fit:cover;
            background: #1b4570;
            position:relative;
          }
          .ep-thumb-wrap { position:relative; overflow:hidden; }
          .ep-play {
            position:absolute; inset:0;
            display:flex; align-items:center; justify-content:center;
            background: rgba(0,0,0,.3);
            opacity:0; transition:opacity .3s;
          }
          .ep-play span { font-size:3rem; filter:drop-shadow(0 0 12px #fff); }
          .ep-card:hover .ep-play { opacity:1; }
          .ep-body { padding:18px; flex:1; display:flex; flex-direction:column; }
          .ep-num {
            font-size:.75rem; font-weight:900; letter-spacing:.1em;
            text-transform:uppercase; color:var(--pink); margin-bottom:6px;
          }
          .ep-title { font-weight:900; font-size:1rem; margin-bottom:8px; }
          .ep-desc { font-size:.85rem; line-height:1.6; color:rgba(255,255,255,.65); flex:1; margin-bottom:14px; }
          .ep-card .btn-primary { padding:10px 20px; font-size:.88rem; align-self:flex-start; }

          /* ══════════════════════════════════════
             VIDEO PLAYER STUB
          ══════════════════════════════════════ */
          .player-wrap {
            background: #050d1a;
            border-radius: 24px;
            overflow:hidden;
            max-width: 900px;
            margin: 0 auto 60px;
            box-shadow: 0 20px 60px rgba(247,37,133,.3), 0 0 0 4px var(--rose);
            position:relative;
          }
          .player-screen {
            aspect-ratio:16/9;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            background: radial-gradient(ellipse at center, #1b4570, #050d1a);
            position:relative; overflow:hidden;
          }
          .player-screen::before {
            content:''; position:absolute; inset:0;
            background: repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0,rgba(255,255,255,.02) 1px, transparent 1px, transparent 4px);
          }
          .player-screen img {
            position:absolute; inset:0; width:100%; height:100%;
            object-fit:cover; opacity:.25;
          }
          .player-icon { font-size:5rem; margin-bottom:20px; animation:float-y 3s ease-in-out infinite; position:relative; z-index:1; }
          .player-text { color:rgba(255,255,255,.7); font-weight:700; font-size:1.1rem; position:relative; z-index:1; }
          .player-bar {
            background:#0d1b2a; padding:14px 20px;
            display:flex; align-items:center; gap:14px;
          }
          .player-btn { background:var(--rose); border:none; border-radius:50%; width:40px; height:40px; color:#fff; font-size:1.1rem; cursor:pointer; transition:transform .2s; }
          .player-btn:hover { transform:scale(1.15); }
          .player-progress { flex:1; height:5px; background:rgba(255,255,255,.15); border-radius:3px; position:relative; }
          .player-progress-fill { width:0%; height:100%; background:var(--rose); border-radius:3px; }
          .player-time { color:rgba(255,255,255,.5); font-size:.8rem; }

