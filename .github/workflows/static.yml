          .spoilers { max-width:780px; margin:0 auto; }
          .spoiler {
            background:#fff; border-radius:14px; margin-bottom:14px;
            overflow:hidden; box-shadow:0 4px 16px var(--shadow-dark);
          }
          .spoiler-btn {
            width:100%; background:none; border:none; cursor:pointer;
            padding:18px 22px; text-align:left;
            display:flex; align-items:center; justify-content:space-between;
            font-family:inherit; font-weight:700; font-size:1rem;
            color:var(--navy); transition:background .2s;
          }
          .spoiler-btn:hover { background:var(--blush); }
          .spoiler-btn .arrow { transition:transform .3s; font-size:1.2rem; }
          .spoiler-btn.open .arrow { transform:rotate(180deg); }
          .spoiler-body {
            max-height:0; overflow:hidden; transition:max-height .35s ease;
            padding:0 22px;
          }
          .spoiler-body.open { padding-bottom:18px; }
          .spoiler-body p { line-height:1.75; color:#444; }

          /* ══════════════════════════════════════
             MANGA INFO BOX
          ══════════════════════════════════════ */
          .manga-about {
            display:grid; grid-template-columns:260px 1fr; gap:40px;
            align-items:start; max-width:900px; margin:0 auto 60px;
          }
          @media(max-width:700px){ .manga-about { grid-template-columns:1fr; } }
          .manga-about-img {
            width:100%; border-radius:16px; box-shadow:0 12px 40px var(--shadow-pink);
            background:var(--blush);
          }
          .manga-about-text h2 { font-size:1.9rem; font-weight:900; color:var(--plum); margin-bottom:14px; }
          .manga-about-text p { line-height:1.8; color:#444; margin-bottom:14px; }
          .manga-meta { list-style:none; display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
          .manga-meta li {
            background:var(--blush); color:var(--rose);
            padding:6px 16px; border-radius:50px;
            font-weight:700; font-size:.88rem;
          }

          /* ══════════════════════════════════════
             FOOTER
          ══════════════════════════════════════ */
          footer {
            background: linear-gradient(135deg, var(--navy), #0d2d44);
            color:rgba(255,255,255,.7); text-align:center;
            padding:40px 20px;
          }
          .footer-logo {
            font-weight:900; font-size:2rem;
            background:linear-gradient(90deg, var(--rose), var(--sky));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            display:block; margin-bottom:10px;
            animation:waku 4s ease-in-out infinite;
          }
          footer small { opacity:.5; font-size:.8rem; display:block; margin-top:8px; }

          /* ══════════════════════════════════════
             RESPONSIVE
          ══════════════════════════════════════ */
          @media(max-width:900px){
            .hero { grid-template-columns:1fr; text-align:center; padding:40px 20px; }
            .hero-right { order:-1; }
            .hero-desc { margin:0 auto 28px; }
            .hero-btns { justify-content:center; }
