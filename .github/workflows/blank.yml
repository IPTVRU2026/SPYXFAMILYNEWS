name: Deploy Anya Forger Kawaii Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create Site Structure
        run: |
          mkdir -p _site
          
          # Create style.css
          cat > _site/style.css << 'EOF'
          @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Bubblegum+Sans&display=swap');
          
          * {
              margin: 0;
              padding: 0;
              box-sizing: border-box;
          }
          
          :root {
              --pink-primary: #ff69b4;
              --pink-light: #ffebee;
              --pink-dark: #ff1493;
              --blue-light: #e1f5fe;
              --purple-light: #f3e5f5;
              --yellow-warm: #fff9c4;
              --white: #ffffff;
              --shadow: rgba(255, 105, 180, 0.3);
          }
          
          body {
              font-family: 'Comic Neue', 'Comic Sans MS', cursive;
              background: linear-gradient(135deg, var(--pink-light) 0%, var(--blue-light) 50%, var(--purple-light) 100%);
              min-height: 100vh;
              color: #5d4037;
              overflow-x: hidden;
          }
          
          /* Floating Animations */
          @keyframes float {
              0%, 100% { transform: translateY(0px) rotate(0deg); }
              50% { transform: translateY(-20px) rotate(5deg); }
          }
          
          @keyframes float-delayed {
              0%, 100% { transform: translateY(0px) rotate(0deg); }
              50% { transform: translateY(-15px) rotate(-5deg); }
          }
          
          @keyframes pulse-heart {
              0%, 100% { transform: scale(1); }
              50% { transform: scale(1.2); }
          }
          
          @keyframes sparkle {
              0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
              50% { opacity: 0.5; transform: scale(0.8) rotate(180deg); }
          }
          
          @keyframes waku-waku {
              0%, 100% { transform: scale(1); }
              25% { transform: scale(1.05) rotate(-2deg); }
              75% { transform: scale(1.05) rotate(2deg); }
          }
          
          @keyframes slide-in {
              from { transform: translateX(-100%); opacity: 0; }
              to { transform: translateX(0); opacity: 1; }
          }
          
          @keyframes bounce {
              0%, 100% { transform: translateY(0); }
              50% { transform: translateY(-10px); }
          }
          
          /* Floating Elements */
          .floating-hearts {
              position: fixed;
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              pointer-events: none;
              z-index: 1000;
              overflow: hidden;
          }
          
          .heart {
              position: absolute;
              font-size: 24px;
              animation: float 6s ease-in-out infinite;
              opacity: 0.6;
          }
          
          .heart:nth-child(1) { left: 5%; top: 10%; animation-delay: 0s; }
          .heart:nth-child(2) { left: 15%; top: 60%; animation-delay: 1s; animation-duration: 7s; }
          .heart:nth-child(3) { left: 80%; top: 20%; animation-delay: 2s; animation-duration: 5s; }
          .heart:nth-child(4) { left: 90%; top: 70%; animation-delay: 3s; animation-duration: 8s; }
          .heart:nth-child(5) { left: 50%; top: 5%; animation-delay: 4s; animation-duration: 6s; }
          
          .star {
              position: absolute;
              font-size: 20px;
              animation: sparkle 3s ease-in-out infinite;
          }
          
          .star:nth-child(6) { left: 25%; top: 30%; animation-delay: 0.5s; }
          .star:nth-child(7) { left: 70%; top: 40%; animation-delay: 1.5s; }
          .star:nth-child(8) { left: 40%; top: 80%; animation-delay: 2.5s; }
          
          /* Navigation */
          nav {
              background: linear-gradient(90deg, var(--pink-primary), var(--pink-dark));
              padding: 15px;
              box-shadow: 0 4px 15px var(--shadow);
              position: sticky;
              top: 0;
              z-index: 100;
          }
          
          nav ul {
              list-style: none;
              display: flex;
              justify-content: center;
              gap: 30px;
              flex-wrap: wrap;
          }
          
          nav a {
              text-decoration: none;
              color: white;
              font-family: 'Bubblegum Sans', cursive;
              font-size: 1.3rem;
              padding: 10px 20px;
              border-radius: 25px;
              transition: all 0.3s ease;
              display: flex;
              align-items: center;
              gap: 8px;
              background: rgba(255,255,255,0.2);
          }
          
          nav a:hover {
              background: rgba(255,255,255,0.4);
              transform: scale(1.1) rotate(-3deg);
              box-shadow: 0 5px 15px rgba(255,255,255,0.3);
          }
          
          nav a.active {
              background: rgba(255,255,255,0.5);
              font-weight: bold;
          }
          
          /* Header Section */
          .hero {
              text-align: center;
              padding: 60px 20px;
              background: linear-gradient(180deg, rgba(255,235,238,0.8) 0%, rgba(225,245,254,0.8) 100%);
              position: relative;
              overflow: hidden;
          }
          
          .hero::before {
              content: '🥜';
              position: absolute;
              font-size: 40px;
              left: 10%;
              top: 20%;
              animation: bounce 2s infinite;
          }
          
          .hero::after {
              content: '✨';
              position: absolute;
              font-size: 35px;
              right: 10%;
              top: 30%;
              animation: sparkle 2s infinite;
          }
          
          .hero h1 {
              font-family: 'Bubblegum Sans', cursive;
              font-size: 3rem;
              color: var(--pink-dark);
              text-shadow: 3px 3px 0px white, 5px 5px 0px var(--pink-primary);
              margin-bottom: 20px;
              animation: waku-waku 3s ease-in-out infinite;
              line-height: 1.3;
          }
          
          .hero-subtitle {
              font-size: 1.5rem;
              color: #ff6b9d;
              font-weight: bold;
              margin-top: 10px;
          }
          
          .anya-peek {
              width: 200px;
              height: 200px;
              border-radius: 50%;
              object-fit: cover;
              border: 5px solid var(--pink-primary);
              box-shadow: 0 10px 30px var(--shadow);
              margin: 20px auto;
              display: block;
              animation: float 4s ease-in-out infinite;
              transition: transform 0.3s;
          }
          
          .anya-peek:hover {
              transform: scale(1.1) rotate(10deg);
          }
          
          /* Buttons */
          .btn-container {
              display: flex;
              gap: 20px;
              justify-content: center;
              flex-wrap: wrap;
              margin: 30px 0;
          }
          
          .btn-kawaii {
              display: inline-flex;
              align-items: center;
              gap: 10px;
              padding: 15px 30px;
              background: linear-gradient(135deg, var(--pink-primary), var(--pink-dark));
              color: white;
              text-decoration: none;
              border-radius: 50px;
              font-family: 'Bubblegum Sans', cursive;
              font-size: 1.2rem;
              box-shadow: 0 5px 15px var(--shadow);
              transition: all 0.3s ease;
              border: 3px solid white;
          }
          
          .btn-kawaii:hover {
              transform: translateY(-5px) scale(1.05);
              box-shadow: 0 10px 25px var(--shadow);
              animation: waku-waku 0.5s ease-in-out;
          }
          
          .btn-secondary {
              background: linear-gradient(135deg, #87CEEB, #4682B4);
          }
          
          .btn-back {
              background: linear-gradient(135deg, #DDA0DD, #9370DB);
              margin: 20px;
          }
          
          /* Gallery Grid */
          .gallery {
              padding: 40px 20px;
              max-width: 1200px;
              margin: 0 auto;
          }
          
          .section-title {
              font-family: 'Bubblegum Sans', cursive;
              font-size: 2.5rem;
              text-align: center;
              color: var(--pink-dark);
              margin-bottom: 30px;
              position: relative;
              display: inline-block;
              width: 100%;
          }
          
          .section-title::before,
          .section-title::after {
              content: '♡';
              color: var(--pink-primary);
              margin: 0 15px;
              animation: pulse-heart 1.5s infinite;
          }
          
          .gallery-grid {
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
              gap: 25px;
              padding: 20px;
          }
          
          .gallery-item {
              background: white;
              border-radius: 20px;
              overflow: hidden;
              box-shadow: 0 8px 25px var(--shadow);
              transition: all 0.4s ease;
              position: relative;
              border: 4px solid transparent;
              background-clip: padding-box;
          }
          
          .gallery-item::before {
              content: '';
              position: absolute;
              top: -4px; left: -4px; right: -4px; bottom: -4px;
              background: linear-gradient(45deg, var(--pink-primary), var(--blue-light), var(--purple-light));
              border-radius: 24px;
              z-index: -1;
          }
          
          .gallery-item:hover {
              transform: translateY(-10px) rotate(2deg);
              box-shadow: 0 15px 35px rgba(255,105,180,0.4);
          }
          
          .gallery-item img {
              width: 100%;
              height: 250px;
              object-fit: cover;
              transition: transform 0.3s;
          }
          
          .gallery-item:hover img {
              transform: scale(1.1);
          }
          
          .gallery-caption {
              padding: 15px;
              text-align: center;
              background: linear-gradient(135deg, var(--pink-light), white);
              font-weight: bold;
              color: var(--pink-dark);
          }
          
          /* Manga & Video Cards */
          .content-grid {
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
              gap: 30px;
              padding: 40px 20px;
              max-width: 1400px;
              margin: 0 auto;
          }
          
          .card {
              background: white;
              border-radius: 25px;
              overflow: hidden;
              box-shadow: 0 10px 30px var(--shadow);
              transition: all 0.4s ease;
              border: 5px solid var(--pink-light);
              position: relative;
          }
          
          .card::after {
              content: '🥜';
              position: absolute;
              top: 10px;
              right: 10px;
              font-size: 24px;
              opacity: 0;
              transition: opacity 0.3s;
          }
          
          .card:hover::after {
              opacity: 1;
              animation: bounce 1s infinite;
          }
          
          .card:hover {
              transform: translateY(-15px) rotate(-2deg);
              border-color: var(--pink-primary);
          }
          
          .card-image {
              width: 100%;
              height: 200px;
              object-fit: cover;
              background: linear-gradient(135deg, var(--blue-light), var(--purple-light));
          }
          
          .card-body {
              padding: 20px;
          }
          
          .card-title {
              font-family: 'Bubblegum Sans', cursive;
              font-size: 1.5rem;
              color: var(--pink-dark);
              margin-bottom: 10px;
          }
          
          .card-text {
              color: #666;
              margin-bottom: 15px;
              line-height: 1.6;
          }
          
          .card-btn {
              display: inline-block;
              padding: 10px 25px;
              background: linear-gradient(135deg, var(--pink-primary), var(--pink-dark));
              color: white;
              text-decoration: none;
              border-radius: 20px;
              font-weight: bold;
              transition: all 0.3s;
              border: 2px solid transparent;
          }
          
          .card-btn:hover {
              background: white;
              color: var(--pink-primary);
              border-color: var(--pink-primary);
              transform: scale(1.05);
          }
          
          /* Video Player Placeholder */
          .video-player {
              background: linear-gradient(135deg, #1a1a2e, #16213e);
              border-radius: 20px;
              padding: 40px;
              text-align: center;
              margin: 20px;
              position: relative;
              overflow: hidden;
              border: 5px solid var(--pink-primary);
          }
          
          .video-player::before {
              content: '📺';
              font-size: 60px;
              display: block;
              margin-bottom: 20px;
              animation: float 3s ease-in-out infinite;
          }
          
          .play-button {
              width: 80px;
              height: 80px;
              background: var(--pink-primary);
              border-radius: 50%;
              display: flex;
              align-items: center;
              justify-content: center;
              margin: 0 auto;
              cursor: pointer;
              transition: all 0.3s;
              box-shadow: 0 5px 20px rgba(255,105,180,0.5);
          }
          
          .play-button:hover {
              transform: scale(1.2);
              background: var(--pink-dark);
          }
          
          .play-button::after {
              content: '▶';
              color: white;
              font-size: 30px;
              margin-left: 5px;
          }
          
          /* Anya Text Bubble */
          .anya-bubble {
              background: white;
              border-radius: 30px;
              padding: 20px 30px;
              margin: 20px auto;
              max-width: 600px;
              position: relative;
              box-shadow: 0 5px 20px var(--shadow);
              border: 3px solid var(--pink-primary);
              text-align: center;
              font-size: 1.2rem;
              color: var(--pink-dark);
              font-weight: bold;
              animation: slide-in 1s ease-out;
          }
          
          .anya-bubble::after {
              content: '';
              position: absolute;
              bottom: -20px;
              left: 50%;
              transform: translateX(-50%);
              border: 10px solid transparent;
              border-top-color: var(--pink-primary);
          }
          
          /* Footer */
          footer {
              background: linear-gradient(135deg, var(--pink-primary), var(--pink-dark));
              color: white;
              text-align: center;
              padding: 30px;
              margin-top: 50px;
              font-family: 'Bubblegum Sans', cursive;
              font-size: 1.2rem;
              position: relative;
          }
          
          footer::before {
              content: '♡ 🥜 ✨ ♡';
              display: block;
              margin-bottom: 10px;
              font-size: 1.5rem;
              animation: pulse-heart 2s infinite;
          }
          
          /* Responsive */
          @media (max-width: 768px) {
              .hero h1 {
                  font-size: 2rem;
              }
              
              nav ul {
                  gap: 15px;
              }
              
              nav a {
                  font-size: 1rem;
                  padding: 8px 15px;
              }
              
              .gallery-grid {
                  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                  gap: 15px;
              }
              
              .content-grid {
                  grid-template-columns: 1fr;
                  padding: 20px 10px;
              }
          }
          
          /* Special Effects */
          .peanut-rain {
              position: fixed;
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              pointer-events: none;
              z-index: 999;
          }
          
          .peanut {
              position: absolute;
              font-size: 20px;
              animation: fall linear infinite;
          }
          
          @keyframes fall {
              to {
                  transform: translateY(100vh) rotate(360deg);
              }
          }
          
          /* Waku Waku Text Animation */
          .waku-text {
              display: inline-block;
              animation: waku-waku 2s ease-in-out infinite;
              color: var(--pink-primary);
              font-weight: bold;
          }
          
          /* Reading/Watching Section Headers */
          .page-header {
              background: linear-gradient(135deg, var(--yellow-warm), var(--pink-light));
              padding: 40px 20px;
              text-align: center;
              position: relative;
              overflow: hidden;
          }
          
          .page-header h1 {
              font-family: 'Bubblegum Sans', cursive;
              font-size: 2.8rem;
              color: var(--pink-dark);
              text-shadow: 2px 2px 0px white;
              position: relative;
              z-index: 1;
          }
          
          .page-header::before {
              content: '📖';
              position: absolute;
              left: 10%;
              top: 50%;
              transform: translateY(-50%);
              font-size: 80px;
              opacity: 0.2;
              animation: float 5s ease-in-out infinite;
          }
          
          .page-header.video::before {
              content: '📺';
          }
          
          /* Description Box */
          .description-box {
              background: white;
              border-radius: 20px;
              padding: 25px;
              margin: 30px auto;
              max-width: 800px;
              text-align: center;
              box-shadow: 0 5px 20px var(--shadow);
              border-left: 5px solid var(--pink-primary);
              border-right: 5px solid var(--pink-primary);
              font-size: 1.1rem;
              line-height: 1.8;
          }
          EOF
          
          # Create index.html
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Аня Форджер - Waku Waku! ♡</title>
              <link rel="stylesheet" href="style.css">
              <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥜</text></svg>">
          </head>
          <body>
              <!-- Floating Elements -->
              <div class="floating-hearts">
                  <span class="heart">💕</span>
                  <span class="heart">💖</span>
                  <span class="heart">💗</span>
                  <span class="heart">💝</span>
                  <span class="heart">💘</span>
                  <span class="star">⭐</span>
                  <span class="star">✨</span>
                  <span class="star">🌟</span>
              </div>
          
              <!-- Navigation -->
              <nav>
                  <ul>
                      <li><a href="index.html" class="active">🏠 Главная</a></li>
                      <li><a href="manga.html">📖 Манга</a></li>
                      <li><a href="video.html">📺 Видео</a></li>
                  </ul>
              </nav>
          
              <!-- Hero Section -->
              <section class="hero">
                  <img src="https://images.alphacoders.com/133/1339434.png" alt="Аня Форджер" class="anya-peek">
                  <h1>Хех?! Аня Форджер приветствует тебя!<br><span class="waku-text">waku waku～ ♡</span></h1>
                  <p class="hero-subtitle">Аня любит арахис, папу, маму и Бонда! 🥜✨</p>
                  
                  <div class="btn-container">
                      <a href="video.html" class="btn-kawaii">📺 Смотреть видео</a>
                      <a href="manga.html" class="btn-kawaii btn-secondary">📖 Читать мангу</a>
                  </div>
              </section>
          
              <!-- Anya Bubble -->
              <div class="anya-bubble">
                  "У-у-у! Ты пришёл поиграть с Аней? Аня будет читать мысли! ...Хех?! Аня не может прочитать... шок! 😱"
              </div>
          
              <!-- Gallery -->
              <section class="gallery">
                  <h2 class="section-title">Галерея милой Ани</h2>
                  <div class="gallery-grid">
                      <div class="gallery-item">
                          <img src="https://images.alphacoders.com/137/1371304.jpg" alt="Аня с арахисом">
                          <div class="gallery-caption">Аня ест арахис 🥜</div>
                      </div>
                      <div class="gallery-item">
                          <img src="https://images.alphacoders.com/122/1229743.jpg" alt="Аня и Дэмиан">
                          <div class="gallery-caption">Аня и Дэмиан 💕</div>
                      </div>
                      <div class="gallery-item">
                          <img src="https://images.wallpapers.com/images/hd/anya-forger-with-loid-and-yor-2cheblhmw5o51hgw.jpg" alt="Семья Форджер">
                          <div class="gallery-caption">Семья Форджер 🏠</div>
                      </div>
                      <div class="gallery-item">
                          <img src="https://images.alphacoders.com/124/1242791.jpg" alt="Аня в школе">
                          <div class="gallery-caption">Аня в Эдеме 🎒</div>
                      </div>
                      <div class="gallery-item">
                          <img src="https://images.wallpapers.com/images/hd/excited-anya-forger-from-spy-x-family-wallpaper-g7r5p7r5p7r5p7r5.jpg" alt="Взволнованная Аня">
                          <div class="gallery-caption">Waku Waku! ✨</div>
                      </div>
                      <div class="gallery-item">
                          <img src="https://images.alphacoders.com/131/1314234.jpg" alt="Аня читает">
                          <div class="gallery-caption">Аня читает мангу 📚</div>
                      </div>
                      <div class="gallery-item">
                          <img src="https://images.wallpapers.com/images/hd/little-anya-aesthetic-anime-girl-iphone-wallpaper-g7r5p7r5p7r5p7r5.jpg" alt="Маленькая Аня">
                          <div class="gallery-caption">Маленькая Аня 🌸</div>
                      </div>
                      <div class="gallery-item">
                          <img src="https://images.alphacoders.com/129/1291234.jpg" alt="Аня с Бондом">
                          <div class="gallery-caption">Аня и Бонд 🐕</div>
                      </div>
                      <div class="gallery-item">
                          <img src="https://images.alphacoders.com/130/1305678.jpg" alt="Аня шпион">
                          <div class="gallery-caption">Аня шпионит 🕵️‍♀️</div>
                      </div>
                  </div>
              </section>
          
              <!-- Fun Facts -->
              <section class="gallery">
                  <h2 class="section-title">Интересные факты об Ане</h2>
                  <div class="description-box">
                      <p>🥜 <strong>Любимая еда:</strong> Арахис и всё с арахисом!</p>
                      <p>📺 <strong>Любимое шоу:</strong> "Шпионские войны" (Spy Wars)</p>
                      <p>🏫 <strong>Школа:</strong> Академия Эдем</p>
                      <p>🐕 <strong>Питомец:</strong> Бонд (пёс-провидец)</p>
                      <p>💭 <strong>Суперсила:</strong> Чтение мыслей!</p>
                      <p>✨ <strong>Фраза:</strong> "Waku waku!" (Волнительно!)</p>
                  </div>
              </section>
          
              <!-- Footer -->
              <footer>
                  Сделано с любовью для Ани ♡ 2026<br>
                  <small>Spy x Family Fan Site</small>
              </footer>
          
              <script>
                  // Peanut rain effect on click
                  document.addEventListener('click', function(e) {
                      if (e.target.tagName !== 'A' && e.target.tagName !== 'BUTTON') {
                          createPeanut(e.clientX, e.clientY);
                      }
                  });
          
                  function createPeanut(x, y) {
                      const peanut = document.createElement('div');
                      peanut.textContent = '🥜';
                      peanut.style.position = 'fixed';
                      peanut.style.left = x + 'px';
                      peanut.style.top = y + 'px';
                      peanut.style.fontSize = '24px';
                      peanut.style.pointerEvents = 'none';
                      peanut.style.zIndex = '9999';
                      peanut.style.animation = 'fall 2s linear forwards';
                      document.body.appendChild(peanut);
                      setTimeout(() => peanut.remove(), 2000);
                  }
          
                  // Add falling animation
                  const style = document.createElement('style');
                  style.textContent = `
                      @keyframes fall {
                          to {
                              transform: translateY(100vh) rotate(360deg);
                              opacity: 0;
                          }
                      }
                  `;
                  document.head.appendChild(style);
